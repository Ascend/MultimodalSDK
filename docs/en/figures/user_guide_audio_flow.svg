<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc"> 
  <title id="title">Audio Processing Workflow</title> 
  <desc id="desc">Shows that load_audio supports single file, file list, and directory input, with optional resampling.</desc> 
  <defs> 
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"> 
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52657a"/> 
    </marker> 
    <style> 
      .box { fill: #f7f9fc; stroke: #52657a; stroke-width: 1.6; rx: 10; } 
      .main { fill: #f0eafe; stroke: #7d63c7; } 
      .out { fill: #e8f5f0; stroke: #328a67; } 
      .text { font-family: "Huawei Sans", "HuaweiSans", "Noto Sans CJK SC", Arial, sans-serif; font-size: 16px; fill: #1f2937; text-anchor: middle; dominant-baseline: middle; } 
      .small { font-size: 14px; } 
      .line { fill: none; stroke: #52657a; stroke-width: 1.8; marker-end: url(#arrow); } 
    </style> 
  </defs> 
 
  <!-- Input Stage -->
  <rect x="55" y="184" width="150" height="56" class="box"/> 
  <text x="130" y="212" class="text">
    <tspan x="130" dy="-2">Prepare WAV input</tspan>
  </text> 
 
  <!-- Alternative Input Formats -->
  <rect x="280" y="54" width="150" height="54" class="box main"/> 
  <text x="355" y="81" class="text">Single file path</text> 
  
  <rect x="280" y="184" width="150" height="54" class="box main"/> 
  <text x="355" y="211" class="text">List of file paths</text> 
  
  <rect x="280" y="314" width="150" height="54" class="box main"/> 
  <text x="355" y="341" class="text">Directory path</text> 
 
  <!-- Branching Lines (Left) -->
  <path d="M 205 212 L 240 212 L 240 81 L 280 81" class="line"/> 
  <path d="M 205 212 L 280 211" class="line"/> 
  <path d="M 205 212 L 240 212 L 240 341 L 280 341" class="line"/> 
 
  <!-- Core Function -->
  <rect x="520" y="184" width="150" height="56" class="box main"/> 
  <text x="595" y="212" class="text">load_audio</text> 
  
  <!-- Merging Lines (Center) -->
  <path d="M 430 81 L 475 81 L 475 212 L 520 212" class="line"/> 
  <path d="M 430 211 L 520 212" class="line"/> 
  <path d="M 430 341 L 475 341 L 475 212 L 520 212" class="line"/> 
 
  <!-- Output Options / Settings -->
  <rect x="735" y="76" width="150" height="64" class="box out"/> 
  <text x="810" y="108" class="text small">
    <tspan x="810" dy="-10">Resample to specified</tspan>
    <tspan x="810" dy="18">sample rate</tspan>
  </text> 
  
  <rect x="735" y="282" width="150" height="64" class="box out"/> 
  <text x="810" y="314" class="text small">
    <tspan x="810" dy="-10">Keep default sample</tspan>
    <tspan x="810" dy="18">rate</tspan>
  </text> 
  
  <!-- Branching Lines (Right) -->
  <path d="M 670 212 L 700 212 L 700 108 L 735 108" class="line"/> 
  <path d="M 670 212 L 700 212 L 700 314 L 735 314" class="line"/> 
 
  <!-- Final Output Block -->
  <rect x="735" y="179" width="150" height="66" class="box out"/> 
  <text x="810" y="212" class="text small">
    <tspan x="810" dy="-10">Return audio data</tspan>
    <tspan x="810" dy="18">and sample rate</tspan>
  </text> 
  
  <!-- Final Internal Flow Lines -->
  <path d="M 810 140 L 810 179" class="line"/> 
  <path d="M 810 282 L 810 245" class="line"/> 
</svg>